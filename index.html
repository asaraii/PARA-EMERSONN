
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz dia del Hot weels❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    touch-action: none;
}

/* PANTALLA DE INICIO */
.inicio {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    background: radial-gradient(circle, #08627d, #032b40 48%, #000);
    transition: opacity 1s ease, visibility 1s ease;
}

.inicio.oculto {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.inicio h1 {
    color: white;
    font-size: clamp(30px, 8vw, 65px);
    margin-bottom: 25px;
    text-shadow: 0 0 10px white, 0 0 25px #00ffff, 0 0 50px #00ffff;
}

.inicio p {
    color: #9fffff;
    font-size: clamp(16px, 4vw, 25px);
    animation: pulsar 1.5s infinite;
}

@keyframes pulsar {
    0%, 100% { opacity: .5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
}

/* AUTO DE ENTRADA */
.autoEntrada {
    position: absolute;
    width: 220px;
    max-width: 60vw;
    left: -300px;
    bottom: 25%;
    filter: drop-shadow(0 0 8px #00ffff) drop-shadow(0 0 25px #00ffff);
}

.inicio.arrancar .autoEntrada {
    animation: autoEntrada 2s ease-in-out forwards;
}

@keyframes autoEntrada {
    0% { left: -300px; }
    65% { left: 50%; transform: translateX(-50%) scale(1.1); }
    100% { left: 120%; transform: scale(.9); }
}

/* ESCENA PRINCIPAL */
.escena {
    position: fixed;
    inset: 0;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    background: radial-gradient(ellipse at center, #075a75, #03384f 35%, #022238 65%, #000913);
    transition: opacity 1.5s ease, visibility 1.5s ease;
}

.escena.visible {
    opacity: 1;
    visibility: visible;
}

/* ESTRELLAS */
.fondo {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1.5px);
    background-size: 55px 55px;
    opacity: .3;
    animation: estrellas 35s linear infinite;
    pointer-events: none;
}

@keyframes estrellas {
    from { background-position: 0 0; }
    to { background-position: 600px 300px; }
}

/* TÍTULO */
.titulo {
    position: absolute;
    z-index: 5000;
    top: 4%;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    text-align: center;
    pointer-events: none;
}

.titulo h1 {
    color: white;
    font-size: clamp(22px, 6vw, 48px);
    text-shadow: 0 0 8px white, 0 0 20px #00ffff, 0 0 40px #00ffff;
}

.titulo span {
    color: #ff492c;
    text-shadow: 0 0 10px red, 0 0 25px orange;
}

/* INDICACIÓN */
.indicacion {
    position: absolute;
    z-index: 6000;
    top: 14%;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    text-align: center;
    color: #9fffff;
    font-size: clamp(10px, 2.5vw, 13px);
    opacity: .8;
    pointer-events: none;
}

/* PLANETA */
.planeta {
    position: absolute;
    left: 50%;
    top: 52%;
    width: 1px;
    height: 1px;
    pointer-events: none;
}

/* ELEMENTOS ORBITALES */
.elemento {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: center;
    pointer-events: none;
    will-change: transform, opacity;
}

/* FRASES */
.texto {
    color: white;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
    text-shadow: 0 0 5px #00ffff, 0 0 12px #00ffff;
}

/* AUTOS ALREDEDOR DEL PLANETA */
.autoPlaneta {
    width: 135px;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 6px #00ffff) drop-shadow(0 0 18px #00ffff);
}

/* CORAZÓN CENTRAL */
.corazonZona {
    position: absolute;
    z-index: 4500;
    left: 50%;
    top: 52%;
    width: min(430px, 96vw);
    height: min(380px, 84vw);
    transform: translate(-50%, -50%);
    pointer-events: none;
}

#corazonCanvas {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 8px #00ffff) drop-shadow(0 0 20px #00ffff) drop-shadow(0 0 50px #00ffff);
}

/* RESPLANDOR DEL CORAZÓN */
.corazonZona::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 80%;
    height: 80%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,255,.24), rgba(0,255,255,.08) 45%, transparent 72%);
    animation: brilloCentro 2s infinite ease-in-out;
}

@keyframes brilloCentro {
    0%, 100% { opacity: .4; transform: translate(-50%, -50%) scale(.8); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
}

/* MENSAJE INFERIOR */
.mensaje {
    position: absolute;
    z-index: 6000;
    left: 50%;
    bottom: 5%;
    transform: translateX(-50%);
    width: 92%;
    text-align: center;
    color: white;
    font-size: clamp(13px, 3vw, 19px);
    text-shadow: 0 0 8px #00ffff, 0 0 18px #00ffff;
    pointer-events: none;
}

/* BOTÓN DE MÚSICA */
.musicaBoton {
    position: absolute;
    z-index: 8000;
    right: 15px;
    bottom: 15px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid #00ffff;
    background: rgba(0,150,220,.4);
    color: white;
    font-size: 21px;
    box-shadow: 0 0 15px #00ffff;
    cursor: pointer;
    touch-action: manipulation;
}

/* ADAPTACIÓN PARA CELULAR */
@media (max-width: 600px) {
    .autoPlaneta { width: 95px; }
    .texto { font-size: 9px; }
    .corazonZona { width: 340px; height: 300px; }
    .indicacion { top: 15%; }
    .mensaje { bottom: 7%; }
}
</style>
</head>

<body>

<!-- MÚSICA -->
<audio id="musica" src="musica/musica.mp3" preload="auto" loop></audio>

<!-- PANTALLA DE INICIO -->
<div class="inicio" id="inicio">
    <h1>🏎️ HotWheels PARA EMERSON❤️</h1>
    <p>TOCA LA PANTALLA</p>
    <img src="autos/auto1.png" class="autoEntrada" alt="">
</div>

<!-- ESCENA -->
<div class="escena" id="escena">
    <div class="fondo"></div>

    <div class="titulo">
        <h1>Felis dia del HotWheels <span>❤️🏎️</span></h1>
    </div>

    <div class="indicacion">
        
    </div>

    <!-- PLANETA CON TEXTOS Y AUTOS -->
    <div class="planeta" id="planeta"></div>

    <!-- CORAZÓN DE PARTÍCULAS, SIN AUTO CENTRAL -->
    <div class="corazonZona" id="corazonZona">
        <canvas id="corazonCanvas"></canvas>
    </div>

    <div class="mensaje">
        Un pequeño detalle para alguien <strong>muy especial ❤️</strong>
    </div>

    <button class="musicaBoton" id="botonMusica" aria-label="Activar o silenciar música">🔊</button>
</div>

<script>
/* =====================================================
   ELEMENTOS PRINCIPALES
===================================================== */

const inicio = document.getElementById("inicio");
const escena = document.getElementById("escena");
const planeta = document.getElementById("planeta");
const musica = document.getElementById("musica");
const canvasCorazon = document.getElementById("corazonCanvas");
const ctx = canvasCorazon.getContext("2d");
const botonMusica = document.getElementById("botonMusica");

/* =====================================================
   50 FRASES
===================================================== */

const textos = [
    "❤️ Eres mi persona favorita",
    "🏎️ Contigo la carretera es mejor",
    "✨ Nunca dejes de sonreír",
    "❤️ Gracias por estar",
    "🏁 A toda velocidad",
    "Contigo todo es mejor",
    "Siempre a mi lado ❤️",
    "Un detalle para ti",
    "Feliz día de los carritos",
    "🏎️ Que nunca termine el viaje",
    "Contigo todo lugar es bonito",
    "❤️ Eres alguien especial",
    "Siempre juntos",
    "✨ Sigue brillando",
    "Corre hacia tus sueños",
    "Nunca dejes de soñar",
    "💙 Siempre contigo",
    "Gracias por cada sonrisa",
    "❤️ Para alguien especial",
    "Qué bonito coincidir contigo",
    "🏁 La aventura continúa",
    "Contigo la vida es mejor",
    "Nunca cambies",
    "Eres increíble",
    "❤️ Un pequeño detalle",
    "Gracias por tantos momentos",
    "Siempre hay motivos para sonreír",
    "🏎️ Sigue adelante",
    "Tu alegría ilumina todo",
    "Contigo todo parece posible",
    "❤️ Gracias por existir",
    "Un momento para recordar",
    "Que nunca falten sonrisas",
    "💫 Siempre hacia adelante",
    "Eres pura energía",
    "Gracias por estar aquí",
    "❤️ Todo es mejor contigo",
    "Que tengas un día hermoso",
    "Siempre puedes contar conmigo",
    "Los mejores recuerdos",
    "Nunca dejes de brillar",
    "🏎️ Vive la aventura",
    "Siempre hay un camino",
    "Contigo todo es bonito",
    "❤️ Un mundo contigo",
    "Gracias por cada momento",
    "Que sigan los buenos momentos",
    "✨ Un motivo para sonreír",
    "Siempre cerca",
    "❤️ Feliz día"
];

/* =====================================================
   CREAR 200 TEXTOS DISPERSOS
===================================================== */

const elementos = [];
const TOTAL_TEXTOS = 400;

for (let i = 0; i < TOTAL_TEXTOS; i++) {
    const elemento = document.createElement("div");
    elemento.className = "elemento";

    const texto = document.createElement("div");
    texto.className = "texto";

    // Repetir las 50 frases cuatro veces
    texto.textContent = textos[i % textos.length];

    elemento.appendChild(texto);

    // Distribución esférica para cubrir frente y parte trasera
    const u = Math.random() * 2 - 1;
    const latitud = Math.asin(u) * 82;
    const longitud = Math.random() * 360;
    const radio = 280 + Math.random() * 200;

    elemento.dataset.lat = latitud;
    elemento.dataset.lon = longitud;
    elemento.dataset.radio = radio;

    // Tamaños variados para dar una apariencia más natural
    elemento.style.fontSize = (9 + Math.random() * 5) + "px";

    planeta.appendChild(elemento);
    elementos.push(elemento);
}

/* =====================================================
   CREAR 15 AUTOS ALREDEDOR DEL PLANETA
===================================================== */

for (let i = 1; i <= 15; i++) {
    const auto = document.createElement("img");
    auto.className = "elemento autoPlaneta";
    auto.src = `autos/auto${i}.png`;
    auto.alt = "";

    // Repartir los autos por distintas latitudes y longitudes
    const u = Math.random() * 2 - 1;
    const latitud = Math.asin(u) * 75;
    const longitud = (i * 137.5 + Math.random() * 18) % 360;
    const radio = 275 + Math.random() * 185;

    auto.dataset.lat = latitud;
    auto.dataset.lon = longitud;
    auto.dataset.radio = radio;

    planeta.appendChild(auto);
    elementos.push(auto);
}

/* =====================================================
   ROTACIÓN DEL PLANETA
===================================================== */

let rotacion = 0;
let velocidad = 0.50;
let velocidadToque = 0;
let tocando = false;
let ultimaX = 0;

/* =====================================================
   ACTUALIZAR POSICIÓN 3D DE LOS ELEMENTOS
===================================================== */

function actualizarPlaneta() {
    const ancho = Math.min(window.innerWidth, 1000);
    const escalaPantalla = Math.max(0.65, Math.min(1, ancho / 850));

    elementos.forEach(elemento => {
        const lat = parseFloat(elemento.dataset.lat);
        const lon = parseFloat(elemento.dataset.lon);
        const radio = parseFloat(elemento.dataset.radio);

        const latRad = lat * Math.PI / 180;
        const lonRad = (lon + rotacion) * Math.PI / 180;

        const x = Math.sin(lonRad) * Math.cos(latRad) * radio;
        const z = Math.cos(lonRad) * Math.cos(latRad) * radio;
        const y = Math.sin(latRad) * radio;

        const profundidad = (z + 480) / 960;
        const escala = (0.48 + profundidad * 0.58) * escalaPantalla;
        const opacidad = 0.3 + profundidad * 0.7;

        const pantallaX = x * 0.88;
        const pantallaY = y * 0.67;

        elemento.style.transform =
            `translate(calc(-50% + ${pantallaX}px), calc(-50% + ${pantallaY}px)) scale(${escala})`;

        elemento.style.opacity = opacidad;
        elemento.style.zIndex = Math.round(100 + z);
    });
}

/* =====================================================
   ANIMACIÓN CONTINUA
===================================================== */

function animarPlaneta() {
    if (!tocando) {
        rotacion += velocidad + velocidadToque;
        velocidadToque *= 0.94;

        if (Math.abs(velocidadToque) < 0.005) {
            velocidadToque = 0;
        }
    }

    actualizarPlaneta();
    requestAnimationFrame(animarPlaneta);
}

animarPlaneta();

/* =====================================================
   ARRASTRAR CON MOUSE O DEDO
===================================================== */

escena.addEventListener("pointerdown", function(e) {
    if (e.target === botonMusica) return;

    tocando = true;
    ultimaX = e.clientX;
    velocidadToque = 0;
});

escena.addEventListener("pointermove", function(e) {
    if (!tocando) return;

    const dx = e.clientX - ultimaX;
    rotacion += dx * 0.48;
    velocidadToque = dx * 0.08;
    ultimaX = e.clientX;

    actualizarPlaneta();
});

function terminarArrastre() {
    tocando = false;
}

escena.addEventListener("pointerup", terminarArrastre);
escena.addEventListener("pointercancel", terminarArrastre);
window.addEventListener("resize", actualizarPlaneta);

/* =====================================================
   CORAZÓN DE PARTÍCULAS
===================================================== */

const CW = 430;
const CH = 380;

canvasCorazon.width = CW;
canvasCorazon.height = CH;

const particulas = [];
const puntosCorazon = [];
const TOTAL_PARTICULAS = 1900;

/* Curva matemática del corazón */
for (let t = 0; t < Math.PI * 2; t += 0.004) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t));

    puntosCorazon.push({
        x: CW / 2 + x * 10,
        y: CH / 2 + y * 10
    });
}

/* Crear partículas alrededor del contorno y dentro del corazón */
for (let i = 0; i < TOTAL_PARTICULAS; i++) {
    const punto = puntosCorazon[
        Math.floor(Math.random() * puntosCorazon.length)
    ];

    particulas.push({
        x: CW / 2 + (Math.random() - 0.5) * 400,
        y: CH / 2 + (Math.random() - 0.5) * 300,
        destinoX: punto.x + (Math.random() - 0.5) * 7,
        destinoY: punto.y + (Math.random() - 0.5) * 7,
        tamaño: Math.random() * 2.4 + 0.6,
        fase: Math.random() * Math.PI * 2,
        dispersada: false
    });
}

/* =====================================================
   DIBUJAR Y ANIMAR EL CORAZÓN
===================================================== */

let tiempo = 0;
let formandoAuto = false;

function dibujarCorazon() {
    ctx.clearRect(0, 0, CW, CH);
    tiempo += 0.035;

    // Latido mientras el corazón está formado
    const latido = formandoAuto
        ? 1
        : 1 + Math.sin(tiempo * 2) * 0.045;

    particulas.forEach(p => {
        // Todas las partículas se mueven hacia su destino
        p.x += (p.destinoX - p.x) * 0.035;
        p.y += (p.destinoY - p.y) * 0.035;

        const centroX = CW / 2;
        const centroY = CH / 2;

        const x = centroX + (p.x - centroX) * latido;
        const y = centroY + (p.y - centroY) * latido;

        const brillo = 0.55 + Math.sin(tiempo * 4 + p.fase) * 0.45;

        ctx.beginPath();
        ctx.arc(x, y, p.tamaño, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(190, 255, 255, ${brillo})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#00ffff";
        ctx.fill();
    });

    ctx.shadowBlur = 0;
    requestAnimationFrame(dibujarCorazon);
}

dibujarCorazon();

/* =====================================================
   DESPUÉS DE 5 SEGUNDOS, DISPERSAR EL CORAZÓN
   NO SE FORMA NINGÚN AUTO EN EL CENTRO
===================================================== */

setTimeout(function() {
    formandoAuto = true;

    particulas.forEach(p => {
        const angulo = Math.random() * Math.PI * 2;
        const distancia = 100 + Math.random() * 300;

        p.destinoX = CW / 2 + Math.cos(angulo) * distancia;
        p.destinoY = CH / 2 + Math.sin(angulo) * distancia;
    });
}, 5000);

/* =====================================================
   INICIAR EXPERIENCIA Y MÚSICA
===================================================== */

let iniciado = false;

inicio.addEventListener("pointerdown", comenzar);

function comenzar() {
    if (iniciado) return;
    iniciado = true;

    musica.volume = 0.7;
    musica.play().catch(() => {});

    inicio.classList.add("arrancar");

    setTimeout(function() {
        escena.classList.add("visible");
        inicio.classList.add("oculto");
    }, 1500);
}

/* =====================================================
   BOTÓN PARA SILENCIAR O ACTIVAR MÚSICA
===================================================== */

let musicaActiva = true;

botonMusica.addEventListener("pointerdown", function(e) {
    e.stopPropagation();

    if (musicaActiva) {
        musica.pause();
        musicaActiva = false;
        botonMusica.textContent = "🔇";
    } else {
        musica.play().catch(() => {});
        musicaActiva = true;
        botonMusica.textContent = "🔊";
    }
});

/* Posiciones iniciales */
actualizarPlaneta();
</script>

</body>
</html>
